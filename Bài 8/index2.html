<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 8 - Danh sách bộ vi xử lý</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h2>Danh sách bộ vi xử lý</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên VXL</th>
                <th>Hãng</th>
                <th>Ngày ra mắt</th>
                <th>Giá</th>
            </tr>
        </thead>
        <tbody id="bangDuLieu"></tbody>
    </table>

    <div class="form-box">
        <h3>Thêm bộ vi xử lý</h3>

        <label for="txtTenVXL">Tên VXL:</label>
        <input type="text" id="txtTenVXL">
        <br>

        <label for="txtHang">Hãng:</label>
        <input type="text" id="txtHang">
        <br>

        <label for="txtNgayramat">Ngày ra mắt:</label>
        <input type="text" id="txtNgayramat"
               placeholder="dd/mm/yyyy">
        <br>

        <label for="txtGia">Giá:</label>
        <input type="number" id="txtGia" min="0">
        <br>

        <button id="btnThem">Thêm</button>
        <button id="btnHuy">Hủy</button>
    </div>

    <script src="script2.js"></script>
</body>
</html>
